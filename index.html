<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería Ane</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f1ed;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 30px;
        }

        button {
            background-color: #111;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #reserva {
            display: none;
            background-color: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        select,
        input {
            width: 90%;
            max-width: 350px;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .campo {
            margin-bottom: 20px;
        }

        #mensaje {
            font-weight: bold;
            margin-top: 20px;
        }

        #estadoHora {
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Peluquería Ane</h1>

    <p class="subtitulo">
        Reserva tu cita online
    </p>

    <button onclick="mostrarReserva()">
        Reservar cita
    </button>

    <div id="reserva">

        <h2>Reserva tu cita</h2>

        <!-- SERVICIO -->
        <div class="campo">
            <p>Servicio</p>
            <select id="servicio">
                <option value="">Cargando servicios...</option>
            </select>
        </div>

        <!-- FECHA -->
        <div class="campo">
            <p>Fecha</p>
            <input type="date" id="fecha">
            <p id="estadoHora"></p>
        </div>

        <!-- HORA -->
        <div class="campo">
            <p>Hora</p>
            <select id="hora">
                <option value="">Selecciona una hora</option>
            </select>
        </div>

        <!-- NOMBRE -->
        <div class="campo">
            <p>Nombre</p>
            <input type="text" id="nombre" placeholder="Tu nombre">
        </div>

        <!-- TELÉFONO -->
        <div class="campo">
            <p>Teléfono</p>
            <input type="tel" id="telefono" placeholder="Tu teléfono">
        </div>

        <button onclick="confirmarCita()">
            Confirmar cita
        </button>

        <p id="mensaje"></p>

    </div>

    <!-- SUPABASE Y JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://gzizbwwqhogynshbyaem.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UCOjOFLBWhvSNbH8mtGChA_Oix4NCYE";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let diasCerrados = [];
        let negocioIdGlobal = null;

        async function obtenerNegocioId() {
            if (negocioIdGlobal) return negocioIdGlobal;

            const { data: negocio, error } = await supabaseClient
                .from("negocios")
                .select("id")
                .eq("nombre", "Peluquería Ane")
                .single();

            if (error || !negocio) {
                console.error("Error obteniendo negocio:", error);
                return null;
            }

            negocioIdGlobal = negocio.id;
            return negocioIdGlobal;
        }

        async function cargarServicios() {

    const selector = document.getElementById("servicio");

    selector.innerHTML = `<option value="">Cargando servicios...</option>`;

    const idNegocio = await obtenerNegocioId();

    if (!idNegocio) {
        selector.innerHTML = `<option value="">No hay servicios disponibles</option>`;
        return;
    }

    const { data: servicios, error } = await supabaseClient
        .from("servicios")
        .select("nombre, precio, duracion")
        .eq("negocio_id", idNegocio)
        .eq("activo", true)
        .order("precio");

    if (error) {
        console.error(error);
        selector.innerHTML = `<option value="">Error cargando servicios</option>`;
        return;
    }

    selector.innerHTML = `<option value="">Selecciona un servicio</option>`;

    servicios.forEach((servicio) => {
        selector.innerHTML += `
            <option value="${servicio.nombre}">
                ${servicio.nombre} (${servicio.duracion} min) - ${Number(servicio.precio).toFixed(2)} €
            </option>
        `;
    });

}

        async function cargarDiasCerrados() {
            const idNegocio = await obtenerNegocioId();
            if (!idNegocio) return;

            const { data, error } = await supabaseClient
                .from("dias_cerrados")
                .select("fecha")
                .eq("negocio_id", idNegocio);

            if (error) {
                console.error("Error cargando días cerrados:", error);
                return;
            }

            diasCerrados = (data || []).map(d => d.fecha);
        }

        function mostrarReserva() {
            document.getElementById("reserva").style.display = "block";
        }

        function obtenerFechaHoy() {
            const hoy = new Date();
            const año = hoy.getFullYear();
            const mes = String(hoy.getMonth() + 1).padStart(2, "0");
            const dia = String(hoy.getDate()).padStart(2, "0");
            return `${año}-${mes}-${dia}`;
        }

        const campoFecha = document.getElementById("fecha");
        campoFecha.min = obtenerFechaHoy();
        campoFecha.addEventListener("change", cargarHoras);

        async function cargarHoras() {

    const fecha = document.getElementById("fecha").value;
    const selectorHora = document.getElementById("hora");
    const estadoHora = document.getElementById("estadoHora");

    selectorHora.innerHTML = `<option value="">Selecciona una hora</option>`;

    if (!fecha) {
        estadoHora.innerText = "";
        return;
    }

    // No permitir fechas pasadas
    const fechaHoy = obtenerFechaHoy();

    if (fecha < fechaHoy) {
        estadoHora.innerText = "❌ No se pueden reservar citas en fechas pasadas.";
        document.getElementById("fecha").value = "";
        return;
    }

    // Día cerrado
    if (diasCerrados.includes(fecha)) {
        estadoHora.innerText = "🏖️ La peluquería está cerrada este día.";
        selectorHora.innerHTML = `<option value="">No disponible</option>`;
        return;
    }

    estadoHora.innerText = "Comprobando horario...";

    // Día de la semana
    const fechaSeleccionada = new Date(fecha + "T00:00:00");
    const diaJavaScript = fechaSeleccionada.getDay();
    const diaSemana = diaJavaScript === 0 ? 7 : diaJavaScript;

    const idNegocio = await obtenerNegocioId();

    // Horario del negocio
    const { data: horarios, error: errorHorarios } = await supabaseClient
        .from("horarios")
        .select("dia_semana, hora_inicio, hora_fin, activo")
        .eq("negocio_id", idNegocio)
        .eq("dia_semana", diaSemana)
        .eq("activo", true);

    if (errorHorarios) {
        console.error(errorHorarios);
        estadoHora.innerText = "❌ No se pudo comprobar el horario.";
        return;
    }

    if (!horarios || horarios.length === 0) {
        estadoHora.innerText = "🔴 La peluquería está cerrada este día.";
        return;
    }

    // Citas del día
    const { data: citas, error: errorCitas } = await supabaseClient
        .from("citas")
        .select("hora, servicio")
        .eq("fecha", fecha)
        .eq("negocio_id", idNegocio);

    if (errorCitas) {
        console.error(errorCitas);
        estadoHora.innerText = "❌ No se pudo comprobar la disponibilidad.";
        return;
    }

    // Duración de servicios
    const { data: servicios } = await supabaseClient
        .from("servicios")
        .select("nombre, duracion")
        .eq("negocio_id", idNegocio);

    const mapaDuraciones = {};

    (servicios || []).forEach((servicio) => {
        mapaDuraciones[servicio.nombre] = servicio.duracion;
    });

    // Horas ocupadas según duración
    const horasOcupadas = [];

    (citas || []).forEach((cita) => {

        const duracion = mapaDuraciones[cita.servicio] || 30;

        let [hora, minutos] = cita.hora.substring(0, 5).split(":").map(Number);

        for (let i = 0; i < duracion; i += 30) {

            horasOcupadas.push(
                String(hora).padStart(2, "0") + ":" +
                String(minutos).padStart(2, "0")
            );

            minutos += 30;

            if (minutos >= 60) {
                hora++;
                minutos -= 60;
            }
        }
    });

    // Horas disponibles del horario
    const horas = generarHorasDesdeHorarios(horarios);

    horas.forEach((hora) => {

        const option = document.createElement("option");
        option.value = hora;

        if (horasOcupadas.includes(hora)) {
            option.textContent = hora + " — Ocupada";
            option.disabled = true;
        } else {
            option.textContent = hora + " — Disponible";
        }

        selectorHora.appendChild(option);
    });

    const horasLibres = horas.filter((hora) => !horasOcupadas.includes(hora));

    if (horasLibres.length === 0) {
        estadoHora.innerText = "❌ No quedan horas disponibles.";
    } else {
        estadoHora.innerText = "✅ Selecciona una hora disponible.";
    }
}

        function normalizarHora(hora) {
            if (!hora) return "";
            return hora.substring(0, 5);
        }

        function generarHorasDesdeHorarios(horarios) {
            const horas = [];

            horarios.forEach(horario => {
                const inicio = normalizarHora(horario.hora_inicio);
                const fin = normalizarHora(horario.hora_fin);

                let [hora, minutos] = inicio.split(":").map(Number);
                const [horaFin, minutosFin] = fin.split(":").map(Number);

                while (hora < horaFin || (hora === horaFin && minutos < minutosFin)) {
                    const horaTexto = String(hora).padStart(2, "0") + ":" + String(minutos).padStart(2, "0");

                    if (!horas.includes(horaTexto)) {
                        horas.push(horaTexto);
                    }

                    minutos += 30;

                    if (minutos >= 60) {
                        hora += Math.floor(minutos / 60);
                        minutos = minutos % 60;
                    }
                }
            });

            horas.sort();
            return horas;
        }

        async function confirmarCita() {

    const servicio = document.getElementById("servicio").value;
    const fecha = document.getElementById("fecha").value;
    const hora = document.getElementById("hora").value;
    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const mensaje = document.getElementById("mensaje");

    // Campos obligatorios
    if (!servicio || !fecha || !hora || !nombre || !telefono) {
        mensaje.innerText = "⚠️ Completa todos los campos.";
        return;
    }

    // Fecha pasada
    if (fecha < obtenerFechaHoy()) {
        mensaje.innerText = "❌ No se pueden reservar citas en fechas pasadas.";
        return;
    }

    mensaje.innerText = "Guardando cita...";

    const idNegocio = await obtenerNegocioId();

    // Obtener servicios (duración)
    const { data: servicios } = await supabaseClient
        .from("servicios")
        .select("nombre, duracion")
        .eq("negocio_id", idNegocio);

    const mapaDuraciones = {};
    (servicios || []).forEach((s) => {
        mapaDuraciones[s.nombre] = s.duracion;
    });

    const duracionNueva = mapaDuraciones[servicio] || 30;

    // Comprobar solapes
    const { data: citasExistentes } = await supabaseClient
        .from("citas")
        .select("hora, servicio")
        .eq("fecha", fecha)
        .eq("negocio_id", idNegocio);

    const nuevaHoraInicio =
        Number(hora.substring(0, 2)) * 60 +
        Number(hora.substring(3, 5));

    const nuevaHoraFin = nuevaHoraInicio + duracionNueva;

    let haySolape = false;

    (citasExistentes || []).forEach((cita) => {

        const inicio =
            Number(cita.hora.substring(0, 2)) * 60 +
            Number(cita.hora.substring(3, 5));

        const fin = inicio + (mapaDuraciones[cita.servicio] || 30);

        if (nuevaHoraInicio < fin && nuevaHoraFin > inicio) {
            haySolape = true;
        }

    });

    if (haySolape) {
        mensaje.innerText = "❌ Ese horario se solapa con otra cita.";
        cargarHoras();
        return;
    }

    // Guardar cliente
    await supabaseClient
        .from("clientes")
        .upsert(
            {
                negocio_id: idNegocio,
                nombre,
                telefono
            },
            {
                onConflict: "negocio_id,telefono"
            }
        );

    // Guardar cita
    const { error } = await supabaseClient
        .from("citas")
        .insert({
            negocio_id: idNegocio,
            nombre,
            telefono,
            servicio,
            fecha,
            hora
        });

    if (error) {

        if (error.code === "23505") {
            mensaje.innerText = "❌ Esa hora ya está ocupada. Elige otra.";
            cargarHoras();
            return;
        }

        console.error(error);
        mensaje.innerText = "❌ No se pudo guardar la cita.";
        return;
    }

    mensaje.innerText = "✅ ¡Cita reservada correctamente!";

    // Limpiar formulario
    document.getElementById("servicio").value = "";
    document.getElementById("fecha").value = "";
    document.getElementById("hora").innerHTML =
        `<option value="">Selecciona una hora</option>`;
    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("estadoHora").innerText = "";

}

        cargarServicios();
        cargarDiasCerrados();
    </script>

</body>

</html>
