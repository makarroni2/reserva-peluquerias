    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {

        #reserva {

        #estadoHora {
            font-weight: bold;
            margin-top: 10px;
        }

    </style>

</head>


<body>

    <h1>Peluquería Ane</h1>

    <p class="subtitulo">
        Reserva tu cita online
    </p>


    <button onclick="mostrarReserva()">
        Reservar cita
    </button>


    <div id="reserva">

        <h2>Reserva tu cita</h2>


        <div class="campo">

            <p>Servicio</p>

            <select id="servicio">

                <option value="">
                    Selecciona un servicio
                </option>

                <option value="Corte">
                    Corte - 15 €
                </option>

                <option value="Corte + barba">
                    Corte + barba - 22 €
                </option>

                <option value="Tinte">
                    Tinte - 35 €
                </option>

            </select>

        </div>


        <div class="campo">

            <p>Fecha</p>

            <input
                type="date"
                id="fecha"
            >

            <p id="estadoHora"></p>

        </div>


        <div class="campo">

            <p>Hora</p>

            <select id="hora">

                <option value="">
                    Selecciona una hora
                </option>

                <option value="10:00">
                    10:00
                </option>

                <option value="11:00">
                    11:00
                </option>

                <option value="12:00">
                    12:00
                </option>

                <option value="17:00">
                    17:00
                </option>

                <option value="18:00">
                    18:00
                </option>

            </select>

        </div>


        <div class="campo">

            <p>Nombre</p>

            <input
                type="text"
                id="nombre"
                placeholder="Tu nombre"
            >

        </div>


        <div class="campo">

            <p>Teléfono</p>

            <input
                type="tel"
                id="telefono"
                placeholder="Tu teléfono"
            >

        </div>


        <button onclick="confirmarCita()">
            Confirmar cita
        </button>


        <p id="mensaje"></p>

    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // ==========================================
        // CONFIGURACIÓN SUPABASE
        // ==========================================

        const SUPABASE_URL =
            "https://gzizbwwqhogynshbyaem.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_UCOjOFLBWhvSNbH8mtGChA_Oix4NCYE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // ==========================================
        // HORAS DISPONIBLES
        // ==========================================

        const horasDisponibles = [

            "10:00",
            "11:00",
            "12:00",
            "17:00",
            "18:00"

        ];



        // ==========================================
        // MOSTRAR RESERVA
        // ==========================================

        function mostrarReserva() {

            document.getElementById("reserva").style.display =
                "block";

        }



        // ==========================================
        // CUANDO CAMBIA LA FECHA
        // ==========================================

        document
            .getElementById("fecha")
            .addEventListener("change", cargarHoras);



        // ==========================================
        // CARGAR HORAS OCUPADAS
        // ==========================================

        async function cargarHoras() {

            const fecha =
                document.getElementById("fecha").value;

            const selectorHora =
                document.getElementById("hora");

            const estadoHora =
                document.getElementById("estadoHora");


            if (!fecha) {

                return;

            }


            estadoHora.innerText =
                "Comprobando disponibilidad...";


            const { data, error } =
                await supabaseClient
                    .from("citas")
                    .select("hora")
                    .eq("fecha", fecha);


            if (error) {

                console.error(
                    "Error comprobando disponibilidad:",
                    error
                );

                estadoHora.innerText =
                    "No se pudo comprobar la disponibilidad.";

                return;

            }


            const horasOcupadas =
                data.map(function(cita) {

                    return cita.hora;

                });


            selectorHora.innerHTML = `
                <option value="">
                    Selecciona una hora
                </option>
            `;


            horasDisponibles.forEach(function(hora) {

                const option =
                    document.createElement("option");


                option.value = hora;


                if (horasOcupadas.includes(hora)) {

                    option.textContent =
                        hora + " — Ocupada";

                    option.disabled = true;

                } else {

                    option.textContent =
                        hora + " — Disponible";

                }


                selectorHora.appendChild(option);

            });


            if (
                horasOcupadas.length ===
                horasDisponibles.length
            ) {

                estadoHora.innerText =
                    "❌ No quedan horas disponibles para este día.";

            } else {

                estadoHora.innerText =
                    "✅ Selecciona una hora disponible.";

            }

        }



        // ==========================================
        // CONFIRMAR CITA
        // ==========================================

        async function confirmarCita() {

            const servicio =
                document.getElementById("servicio").value;


            const fecha =
                document.getElementById("fecha").value;


            const hora =
                document.getElementById("hora").value;


            const nombre =
                document.getElementById("nombre").value;


            const telefono =
                document.getElementById("telefono").value;


            const mensaje =
                document.getElementById("mensaje");


            // Comprobar campos

            if (
                servicio === "" ||
                fecha === "" ||
                hora === "" ||
                nombre === "" ||
                telefono === ""
            ) {

                mensaje.innerText =
                    "⚠️ Completa todos los campos.";

                return;

            }


            mensaje.innerText =
                "Guardando cita...";


            // Guardar en Supabase

            const { data, error } =
                await supabaseClient
                    .from("citas")
                    .insert([
                        {
                            nombre: nombre,
                            telefono: telefono,
                            servicio: servicio,
                            fecha: fecha,
                            hora: hora
                        }
                    ])
                    .select();


            // Error

            if (error) {

                console.error(
                    "Error Supabase:",
                    error
                );


                // Reserva duplicada

                if (error.code === "23505") {

                    mensaje.innerText =
                        "❌ Esa hora ya está ocupada. Elige otra.";

                    // Actualizar disponibilidad

                    cargarHoras();

                    return;

                }


                mensaje.innerText =
                    "❌ No se pudo guardar la cita.";

                return;

            }


            // Cita guardada

            console.log(
                "Cita guardada:",
                data
            );


            mensaje.innerText =
                "✅ ¡Cita reservada correctamente!";


            // Limpiar formulario

            document.getElementById("servicio").value =
                "";

            document.getElementById("fecha").value =
                "";

            document.getElementById("hora").innerHTML = `
                <option value="">
                    Selecciona una hora
                </option>
            `;

            document.getElementById("nombre").value =
                "";

            document.getElementById("telefono").value =
                "";

            document.getElementById("estadoHora").innerText =
                "";

        }

    </script>


</body>

</html>
