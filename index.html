<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería Ane</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f1ed;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 30px;
        }

        button {
            background-color: #111;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #reserva {
            display: none;
            background-color: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        select,
        input {
            width: 90%;
            max-width: 350px;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .campo {
            margin-bottom: 20px;
        }

        #mensaje {
            font-weight: bold;
            margin-top: 20px;
        }

        #estadoHora {
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Peluquería Ane</h1>

    <p class="subtitulo">
        Reserva tu cita online
    </p>

    <button onclick="mostrarReserva()">
        Reservar cita
    </button>

    <div id="reserva">

        <h2>Reserva tu cita</h2>

        <!-- SERVICIO -->
        <div class="campo">
            <p>Servicio</p>
            <select id="servicio">
                <option value="">Cargando servicios...</option>
            </select>
        </div>

        <!-- FECHA -->
        <div class="campo">
            <p>Fecha</p>
            <input type="date" id="fecha">
            <p id="estadoHora"></p>
        </div>

        <!-- HORA -->
        <div class="campo">
            <p>Hora</p>
            <select id="hora">
                <option value="">Selecciona una hora</option>
            </select>
        </div>

        <!-- NOMBRE -->
        <div class="campo">
            <p>Nombre</p>
            <input type="text" id="nombre" placeholder="Tu nombre">
        </div>

        <!-- TELÉFONO -->
        <div class="campo">
            <p>Teléfono</p>
            <input type="tel" id="telefono" placeholder="Tu teléfono">
        </div>

        <button onclick="confirmarCita()">
            Confirmar cita
        </button>

        <p id="mensaje"></p>

    </div>

    <!-- SUPABASE Y JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://gzizbwwqhogynshbyaem.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UCOjOFLBWhvSNbH8mtGChA_Oix4NCYE";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let diasCerrados = [];
        let negocioIdGlobal = null;

        async function obtenerNegocioId() {
            if (negocioIdGlobal) return negocioIdGlobal;

            const { data: negocio, error } = await supabaseClient
                .from("negocios")
                .select("id")
                .eq("nombre", "Peluquería Ane")
                .single();

            if (error || !negocio) {
                console.error("Error obteniendo negocio:", error);
                return null;
            }

            negocioIdGlobal = negocio.id;
            return negocioIdGlobal;
        }

        async function cargarServicios() {
            const selector = document.getElementById("servicio");
            selector.innerHTML = `<option value="">Cargando servicios...</option>`;

            const idNegocio = await obtenerNegocioId();

            if (!idNegocio) {
                selector.innerHTML = `<option value="">No hay servicios disponibles</option>`;
                return;
            }

            const { data: servicios, error } = await supabaseClient
                .from("servicios")
                .select("nombre, precio, duracion")
                .eq("negocio_id", idNegocio)
                .eq("activo", true)
                .order("precio");

            if (error) {
                console.error(error);
                selector.innerHTML = `<option value="">Error cargando servicios</option>`;
                return;
            }

            selector.innerHTML = `<option value="">Selecciona un servicio</option>`;

            servicios.forEach((servicio) => {
                selector.innerHTML += `
                    <option value="${servicio.nombre}">
                        ${servicio.nombre} (${servicio.duracion} min) - ${Number(servicio.precio).toFixed(2)} €
                    </option>
                `;
            });
        }

        async function cargarDiasCerrados() {
            const idNegocio = await obtenerNegocioId();
            if (!idNegocio) return;

            const { data, error } = await supabaseClient
                .from("dias_cerrados")
                .select("fecha")
                .eq("negocio_id", idNegocio);

            if (error) {
                console.error("Error cargando días cerrados:", error);
                return;
            }

            diasCerrados = (data || []).map(d => d.fecha);
        }

        function mostrarReserva() {
            document.getElementById("reserva").style.display = "block";
        }

        function obtenerFechaHoy() {
            const hoy = new Date();
            const año = hoy.getFullYear();
            const mes = String(hoy.getMonth() + 1).padStart(2, "0");
            const dia = String(hoy.getDate()).padStart(2, "0");
            return `${año}-${mes}-${dia}`;
        }

        const campoFecha = document.getElementById("fecha");
        campoFecha.min = obtenerFechaHoy();
        campoFecha.addEventListener("change", cargarHoras);
        document.getElementById("servicio").addEventListener("change", cargarHoras);

        function normalizarHora(hora) {
            if (!hora) return "";
            return hora.substring(0, 5);
        }

        function generarHorasDesdeHorarios(horarios) {
            const horas = [];
            horarios.forEach(h => {
                let [hInicio, mInicio] = normalizarHora(h.hora_inicio).split(":").map(Number);
                let [hFin, mFin] = normalizarHora(h.hora_fin).split(":").map(Number);

                let minutosActuales = hInicio * 60 + mInicio;
                let minutosFin = hFin * 60 + mFin;

                while (minutosActuales < minutosFin) {
                    let hh = Math.floor(minutosActuales / 60);
                    let mm = minutosActuales % 60;
                    horas.push(
                        String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0")
                    );
                    minutosActuales += 30; // Intervalos de 30 min
                }
            });
            return horas;
        }

        async function cargarHoras() {
            const fecha = document.getElementById("fecha").value;
            const selectorHora = document.getElementById("hora");
            const estadoHora = document.getElementById("estadoHora");
            const servicioSeleccionado = document.getElementById("servicio").value;

            selectorHora.innerHTML = `<option value="">Selecciona una hora</option>`;

            if (!fecha || !servicioSeleccionado) {
                estadoHora.innerText = "Selecciona primero un servicio y una fecha.";
                return;
            }

            if (diasCerrados.includes(fecha)) {
                estadoHora.innerText = "🏖️ La peluquería está cerrada este día.";
                return;
            }

            const idNegocio = await obtenerNegocioId();

            // Obtener duración del servicio elegido
            const { data: servicio } = await supabaseClient
                .from("servicios")
                .select("duracion")
                .eq("negocio_id", idNegocio)
                .eq("nombre", servicioSeleccionado)
                .single();

            const duracion = servicio?.duracion || 30;

            // Día de la semana
            const fechaObj = new Date(fecha + "T00:00:00");
            const diaSemana = fechaObj.getDay() === 0 ? 7 : fechaObj.getDay();

            // Horario del negocio
            const { data: horarios } = await supabaseClient
                .from("horarios")
                .select("*")
                .eq("negocio_id", idNegocio)
                .eq("dia_semana", diaSemana)
                .eq("activo", true);

            if (!horarios || horarios.length === 0) {
                estadoHora.innerText = "🔴 La peluquería está cerrada ese día.";
                return;
            }

            // Citas existentes
            const { data: citas } = await supabaseClient
                .from("citas")
                .select("hora, servicio")
                .eq("negocio_id", idNegocio)
                .eq("fecha", fecha);

            // Servicios (para conocer duración de cada cita)
            const { data: servicios } = await supabaseClient
                .from("servicios")
                .select("nombre, duracion")
                .eq("negocio_id", idNegocio);

            const mapaDuraciones = {};
            (servicios || []).forEach(s => mapaDuraciones[s.nombre] = s.duracion);

            // Horas bloqueadas
            const horasOcupadas = [];

            (citas || []).forEach(cita => {
                const dur = mapaDuraciones[cita.servicio] || 30;
                let [h, m] = cita.hora.substring(0, 5).split(":").map(Number);

                for (let i = 0; i < dur; i += 30) {
                    horasOcupadas.push(
                        String(h).padStart(2, "0") + ":" +
                        String(m).padStart(2, "0")
                    );

                    m += 30;
                    if (m >= 60) {
                        h++;
                        m -= 60;
                    }
                }
            });

            const horas = generarHorasDesdeHorarios(horarios);

            if (horas.length === 0) {
                estadoHora.innerText = "❌ No hay horarios configurados para este día.";
                return;
            }

            horas.forEach(hora => {
                let libre = true;
                let [h, m] = hora.split(":").map(Number);

                for (let i = 0; i < duracion; i += 30) {
                    const bloque =
                        String(h).padStart(2, "0") + ":" +
                        String(m).padStart(2, "0");

                    if (horasOcupadas.includes(bloque)) {
                        libre = false;
                    }

                    m += 30;
                    if (m >= 60) {
                        h++;
                        m -= 60;
                    }
                }

                const option = document.createElement("option");
                option.value = hora;

                if (libre) {
                    option.textContent = hora + " — Disponible";
                } else {
                    option.textContent = hora + " — Ocupada";
                    option.disabled = true;
                }

                selectorHora.appendChild(option);
            });

            estadoHora.innerText = "✅ Selecciona una hora disponible.";
        }

        async function confirmarCita() {
            const servicio = document.getElementById("servicio").value;
            const fecha = document.getElementById("fecha").value;
            const hora = document.getElementById("hora").value;
            const nombre = document.getElementById("nombre").value.trim();
            const telefono = document.getElementById("telefono").value.trim();
            const mensaje = document.getElementById("mensaje");

            if (!servicio || !fecha || !hora || !nombre || !telefono) {
                mensaje.style.color = "red";
                mensaje.innerText = "Por favor, completa todos los campos.";
                return;
            }

            const idNegocio = await obtenerNegocioId();

            const { error } = await supabaseClient
                .from("citas")
                .insert([
                    {
                        negocio_id: idNegocio,
                        servicio: servicio,
                        fecha: fecha,
                        hora: hora,
                        nombre: nombre,
                        telefono: telefono
                    }
                ]);

            if (error) {
                console.error("Error al guardar la cita:", error);
                mensaje.style.color = "red";
                mensaje.innerText = "Hubo un error al reservar. Inténtalo de nuevo.";
                return;
            }

            mensaje.style.color = "green";
            mensaje.innerText = "¡Cita reservada con éxito!";
            
            // Recargar horas disponibles y limpiar campos básicos
            setTimeout(() => {
                document.getElementById("nombre").value = "";
                document.getElementById("telefono").value = "";
                cargarHoras();
            }, 1500);
        }

        // Inicializar datos al cargar la página
        cargarServicios();
        cargarDiasCerrados();
    </script>

</body>

</html>
